<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Noann Fe - 2D Lotto Winner!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffdde1 100%);
            font-family: 'Georgia', serif;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .castle {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 192, 203, 0.3) 100%);
            z-index: 1;
        }

        .castle::before {
            content: '🏰';
            position: absolute;
            font-size: 120px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            position: relative;
        }

        .crown {
            font-size: 150px;
            animation: spin-crown 4s ease-in-out infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(255, 215, 0, 0.5));
        }

        @keyframes spin-crown {
            0%, 100% { transform: rotate(-10deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
        }

        .main-title {
            font-size: 70px;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #da70d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: glow-pink 2s ease-in-out infinite;
            margin-bottom: 20px;
            font-weight: bold;
            font-style: italic;
        }

        @keyframes glow-pink {
            0%, 100% { 
                filter: drop-shadow(0 0 10px #ff69b4);
            }
            50% { 
                filter: drop-shadow(0 0 25px #ff1493) drop-shadow(0 0 40px #ff69b4);
            }
        }

        .princess-title {
            font-size: 50px;
            color: #ff1493;
            text-shadow: 3px 3px 6px rgba(255, 182, 193, 0.8);
            margin-bottom: 15px;
            font-style: italic;
            animation: sparkle-text 3s ease-in-out infinite;
        }

        @keyframes sparkle-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        .name {
            font-size: 110px;
            background: linear-gradient(45deg, #ffd700, #ffb6c1, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-name 4s ease-in-out infinite;
            margin: 30px 0;
            font-weight: bold;
            filter: drop-shadow(4px 4px 8px rgba(255, 105, 180, 0.6));
            font-style: italic;
        }

        @keyframes rainbow-name {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .subtitle {
            font-size: 55px;
            color: #ff1493;
            text-shadow: 3px 3px 6px rgba(255, 182, 193, 0.6);
            margin-bottom: 25px;
            font-weight: bold;
        }

        .special-message {
            font-size: 38px;
            color: #ff69b4;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            animation: fadeIn 3s ease-in;
            max-width: 90%;
            margin: 0 auto;
            font-style: italic;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            border: 3px solid rgba(255, 105, 180, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            font-size: 40px;
            animation: float-heart linear infinite;
            opacity: 0;
        }

        @keyframes float-heart {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0);
            }
            10% {
                opacity: 1;
                transform: translateY(-20px) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(0.5);
            }
        }

        .flower {
            position: absolute;
            font-size: 35px;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }

        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #fff 0%, #ffb6c1 50%, transparent 70%);
            border-radius: 50%;
            animation: sparkleAnim 1.5s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { 
                opacity: 0; 
                transform: scale(0);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.5);
            }
        }

        .winner-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 28px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            transform: rotate(15deg);
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.4);
            animation: wiggle 2s ease-in-out infinite;
            font-weight: bold;
            border: 3px solid #ffd700;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(15deg) scale(1); }
            50% { transform: rotate(18deg) scale(1.05); }
        }

        .butterfly {
            position: absolute;
            font-size: 45px;
            animation: fly 8s ease-in-out infinite;
        }

        @keyframes fly {
            0%, 100% { 
                transform: translate(0, 0) rotate(0deg); 
            }
            25% { 
                transform: translate(200px, -100px) rotate(10deg); 
            }
            50% { 
                transform: translate(400px, 50px) rotate(-10deg); 
            }
            75% { 
                transform: translate(200px, 100px) rotate(5deg); 
            }
        }

        .ribbon {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        @media (max-width: 768px) {
            .crown { font-size: 80px; }
            .main-title { font-size: 45px; }
            .princess-title { font-size: 32px; }
            .name { font-size: 65px; }
            .subtitle { font-size: 35px; }
            .special-message { font-size: 24px; }
            .winner-badge { 
                font-size: 18px; 
                padding: 10px 20px;
                top: 20px;
                right: 20px;
            }
            .castle::before { font-size: 70px; }
            .ribbon { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="castle"></div>
    <div class="ribbon">🎀</div>
    <div class="winner-badge">👑 WINNER! 👑</div>
    
    <div class="container">
        <div class="crown">👑</div>
        <div class="princess-title">✨ Princess ✨</div>
        <div class="main-title">CONGRATULATIONS!</div>
        <div class="name">NOANN FE</div>
        <div class="subtitle">2D LOTTO WINNER! 💎</div>
        <div class="special-message">
            💖 You are so special and this win is just the beginning of amazing things! 💖
        </div>
    </div>

    <script>
        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                const hearts = ['💕', '💖', '💗', '💝', '💓'];
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 7000);
            }, 300);
        }

        function createFlowers() {
            const flowerTypes = ['🌸', '🌺', '🌼', '🌻', '🌷', '🌹'];
            for (let i = 0; i < 25; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.textContent = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.style.left = Math.random() * 95 + '%';
                flower.style.top = Math.random() * 95 + '%';
                flower.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(flower);
            }
        }

        function createSparkles() {
            setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1500);
            }, 150);
        }

        function createButterflies() {
            const butterflies = ['🦋', '🦋', '🦋'];
            butterflies.forEach((butterfly, index) => {
                const elem = document.createElement('div');
                elem.className = 'butterfly';
                elem.textContent = butterfly;
                elem.style.left = (index * 30) + '%';
                elem.style.top = (Math.random() * 50) + '%';
                elem.style.animationDelay = (index * 2) + 's';
                document.body.appendChild(elem);
            });
        }

        createHearts();
        createFlowers();
        createSparkles();
        createButterflies();
    </script>
</body>
</html>
